stack: "python"
stackVersion: "3"
imageName: "my-lightweight-python-app"
resources:
  cpu: "0.7"
  memory: "100Mi"
buildCmd: "echo 'No compilation needed for Python!'"
testCmd: |
  export PYTHONPATH=$(python3 -c "import sys; print(':'.join(sys.path))")
  python3 -m pip install --target=.local_modules pytest flask
  export PYTHONPATH=$(pwd)/.local_modules:$PYTHONPATH
  python3 -m pytest -v
