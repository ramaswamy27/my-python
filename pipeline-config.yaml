stack: "python"
stackVersion: "3.11-slim"
imageName: "my-lightweight-python-app"
imageVer: 2.11.13
resources:
  cpu: "0.7"
  memory: "100Mi"
buildCmd: "echo 'No compilation needed for Python!'"
testCmd: "sh -c 'python3 -m pip install --target=.local_modules pytest flask && PYTHONPATH=.local_modules python3 -m pytest -v; rc=$?; if [ $rc -eq 5 ]; then exit 0; else exit $rc; fi'"
